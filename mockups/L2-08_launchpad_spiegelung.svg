<text x="700" y="690" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#C7C7CC" text-anchor="start" >rechte Spalte: Szenen ▶ (Option S), Zurück, Wiederholen, Alles still</text>
<text x="700" y="712" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#C7C7CC" text-anchor="start" >untere Pad-Reihe: Spur-Stopp (Option S) · gestrichelt: gewähltes Pad (LED-Puls)</text>
<text x="60" y="668" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#C7C7CC" text-anchor="start" >oberste Reihe (optional): Spielen · Aufnehmen · Loop · Löschen · Verlauf</text>
<text x="60" y="690" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#C7C7CC" text-anchor="start" >übrige 52 Pads dunkel: nichts lenkt ab</text>
<rect x="0" y="800" width="1280" height="170" fill="#F4F4F6"/><rect x="0" y="800" width="1280" height="4" fill="#7FA7FF"/><text x="24" y="832" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" font-weight="700" fill="#111114" text-anchor="start" >Loopstation 2 · L2-08 · Launchpad-Spiegelung – Kindermodus und Elternmodus</text><text x="24" y="852" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#55555C" text-anchor="start" >Konzept §2.6 · midi/launchpad.py (Programmer-Modus)</text><text x="24" y="876.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >Links Kindermodus wie heute: nur das 4 × 3-Feld oben links leuchtet in den Pad-Farben, alles andere bleibt dunkel (reizarm). Neu optional: oberste Reihe = die fünf Modi in ihren Farben.</text><text x="24" y="893.5" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >Rechts Elternmodus: gewähltes Pad atmet weich (LED-Puls, kein Blinken), rechte Knopfspalte = Szenen-▶ (Option S) bzw. Zurück/Wiederholen/Alles still, unterste Reihe = Spur-Stopp. Pfeiltasten oben</text><text x="24" y="911.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >wählen das Pad wie die Pfeiltasten am Rechner.</text><text x="24" y="928.5" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >Grundlage nur Novations öffentliches Programmer's Reference; die heutige Abbildung (note_for/pad_for) bleibt, sie wird nur um Knopf-Ereignisse erweitert. Test am echten Gerät steht weiter aus.</text>
</svg>
