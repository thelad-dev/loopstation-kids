<rect x="0" y="800" width="1280" height="116" fill="#F4F4F6"/><rect x="0" y="800" width="1280" height="4" fill="#40A9FF"/><text x="24" y="834" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#111114" text-anchor="start" >Mockup 03 · Kinderseite – Warten auf den Loop-Anfang (ruhiger Puls)</text><text x="1256" y="834" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#55555C" text-anchor="end" >Plan §2.2 Regel 7, §13 Launch-Quantisierung, §3.2 Metronom</text><text x="24" y="858" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A41" text-anchor="start" >Loop-Modus: Pad 2 startet am nächsten Takt-Anfang. Bis dahin weicher, langsamer Puls-Ring (kein Blinken) und ein sich füllender Balken – vorhersehbar statt Überraschung.</text><text x="24" y="877" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A41" text-anchor="start" >Unten nur visueller Puls (4 Punkte = Schläge des Takts). Kein Ton-Metronom auf der Kinderseite.</text>
