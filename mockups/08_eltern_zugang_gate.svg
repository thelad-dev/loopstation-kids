<rect x="0" y="800" width="1280" height="116" fill="#F4F4F6"/><rect x="0" y="800" width="1280" height="4" fill="#7FA7FF"/><text x="24" y="834" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#111114" text-anchor="start" >Mockup 08 · Eltern-Zugang (Parental Gate)</text><text x="1256" y="834" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#55555C" text-anchor="end" >Plan §3 Elternbereich, §16 (Gate ≠ Einwilligung)</text><text x="24" y="858" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A41" text-anchor="start" >Erreichbar über das kleine Schloss unten rechts auf der Kinderseite (2 s halten). Dann eine Rechenaufgabe mit großen Zifferntasten; falsch = einfach zurück, kein Alarm.</text><text x="24" y="877" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A41" text-anchor="start" >Hinweis an Eltern: Das Gate schützt vor versehentlichem Öffnen, es ist keine datenschutzrechtliche Einwilligung.</text>
