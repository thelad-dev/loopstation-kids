<rect x="0" y="800" width="1280" height="170" fill="#F4F4F6"/><rect x="0" y="800" width="1280" height="4" fill="#7FA7FF"/><text x="24" y="832" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="19" font-weight="700" fill="#111114" text-anchor="start" >Loopstation 2 · L2-09 · Moduswechsel mit Sperre – Kinder → Eltern nur über das Schloss, Eltern → Kinder ein Tipp</text><text x="24" y="852" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#55555C" text-anchor="start" >Konzept §2.3 · parent_gate.py, parent_tile.py</text><text x="24" y="876.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >Gleiches Fenster, kein modaler Dialog: die Kinderseite wird abgedunkelt, die Rechenaufgabe liegt darüber; Musik läuft weiter. Nach richtiger Antwort blendet das Fenster in die Eltern-Pad-Ansicht</text><text x="24" y="893.5" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >über (L2-02).</text><text x="24" y="911.0" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >Zurück zu den Kindern: Umschalter oben links oder Taste F1; nach N Minuten ohne Eingabe (Standard 10, einstellbar) kehrt die Ansicht von selbst zur Kinderseite zurück. Die Sperre bleibt 5 min</text><text x="24" y="928.5" font-family="Inter, 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="12.8" font-weight="400" fill="#3A3A41" text-anchor="start" >offen, falls Eltern gleich wieder wechseln (einstellbar, 0 = immer fragen).</text>
