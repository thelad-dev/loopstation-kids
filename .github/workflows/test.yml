name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Not 3.11: PySide6 6.12.0 drops a reference to None on every void Qt call there (immortal since
          # 3.12), which aborts the interpreter at exit once a test run makes enough of them.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
