[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopstation-kids"
version = "1.1.3"
description = "Kindgerechte Loopstation im Novation-Launchpad-Stil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "sounddevice>=0.5.1",
    "soundfile>=0.12",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.5"]
# Rubber Band (GPL) for the better time stretch, only on request; the simple stretch runs without it.
rubberband = ["pylibrb>=0.1.2"]

[project.scripts]
loopstation = "loopstation.app:main"

[tool.setuptools.packages.find]
include = ["loopstation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["mockups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
