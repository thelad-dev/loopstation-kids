# Einstellungen der Loopstation.
# Nach einer Änderung die Loopstation neu starten.
# Fehlt diese Datei, gelten genau die Werte unten.

# Größe des Pad-Rasters: Zeilen und Spalten (je 1 bis 16).
rows = 3
cols = 4

# Längste Aufnahme in Sekunden (1 bis 120). Danach stoppt sie von selbst.
max_record_seconds = 10

# Abtastrate für Aufnahme und Wiedergabe in Hz.
sample_rate = 44100

# Kurzer Piepton beim Start und Ende einer Aufnahme.
sound_effects = true

# true = Vollbild ohne Fensterrahmen, false = maximiertes Fenster.
fullscreen = false

# Novation Launchpad automatisch suchen und benutzen.
launchpad = true

# Taktgenauer Schnitt: Die erste Aufnahme bestimmt die Loop-Länge. Jede weitere
# Aufnahme wird auf genau diese Länge (oder ein Vielfaches davon) geschnitten,
# und Loops starten und stoppen nur am Loop-Anfang, damit alles im Takt bleibt.
# false = jede Aufnahme behält ihre eigene Länge, Loops starten sofort.
loop_sync = true

# Verzögerung zwischen Lautsprecher und Mikrofon in Millisekunden (0 bis 1000),
# damit neue Loops genau auf den gehörten liegen. "auto" nimmt den Wert, den
# der Audiotreiber meldet. Klingen neue Loops etwas zu spät, die Zahl erhöhen;
# klingen sie zu früh, verkleinern.
latency_ms = "auto"

# Ordner für die Daten (relativ zum Startordner):
# Aufnahmen in <data_dir>/samples/, Ereignis-Protokoll in <data_dir>/data/.
data_dir = "."
