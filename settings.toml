# Einstellungen der Loopstation.
# Fehlt diese Datei, gelten genau die Werte unten.
#
# Änderungen in der Einstellungsseite (Eltern-Bereich) gelten sofort, außer bei
# rows, cols, sample_rate, asio und data_dir: die wirken erst nach einem Neustart.
# Wer diese Datei von Hand ändert, startet die Loopstation neu.

# Größe des Pad-Rasters: Zeilen und Spalten (je 1 bis 16). Neustart nötig.
rows = 3
cols = 4

# Längste Aufnahme in Sekunden (1 bis 120). Danach stoppt sie von selbst. Wirkt sofort.
max_record_seconds = 10

# Abtastrate für Aufnahme und Wiedergabe in Hz (8000 bis 192000). Neustart nötig.
sample_rate = 44100

# Kurzer Piepton beim Start und Ende einer Aufnahme. Wirkt sofort.
sound_effects = true

# Piepton beim Start einer Aufnahme (gilt nur, solange sound_effects = true).
# Er klingt vollständig aus, bevor die Aufnahme beginnt, und ist nie auf ihr zu
# hören; die Aufnahme beginnt dadurch einen Moment nach dem Druck.
# false = kein Start-Ton, die Aufnahme beginnt sofort. Wirkt sofort.
record_start_tone = true

# true = Vollbild ohne Fensterrahmen, false = maximiertes Fenster. Wirkt sofort.
fullscreen = false

# Novation Launchpad automatisch suchen und benutzen. Wirkt sofort.
launchpad = true

# Taktgenauer Schnitt: Die erste Aufnahme bestimmt die Loop-Länge. Jede weitere
# Aufnahme wird auf genau diese Länge (oder ein Vielfaches davon) geschnitten,
# und Loops starten und stoppen nur am Loop-Anfang, damit alles im Takt bleibt.
# false = jede Aufnahme behält ihre eigene Länge, Loops starten sofort. Wirkt sofort.
loop_sync = true

# Verzögerung zwischen Lautsprecher und Mikrofon in Millisekunden (0 bis 1000),
# damit neue Loops genau auf den gehörten liegen. "auto" nimmt den Wert, den
# der Audiotreiber meldet. Klingen neue Loops etwas zu spät, die Zahl erhöhen;
# klingen sie zu früh, verkleinern. Wirkt sofort.
latency_ms = "auto"

# Ordner für die Daten (relativ zum Startordner):
# Aufnahmen in <data_dir>/samples/, Ereignis-Protokoll in <data_dir>/data/.
# Neustart nötig.
data_dir = "."

# --- Loop-Naht ---
# Das Ende jedes Loops wird weich ausgeblendet (bis 25 ms), der Anfang nur 2 ms eingeblendet,
# damit es beim Sprung vom Ende zum Anfang nicht knackt und der erste Schlag erhalten bleibt.
# Die Loop-Länge bleibt gleich.
# false = harter Sprung wie bisher. Wirkt sofort (für neue Aufnahmen und den Export).
soft_seam = true

# --- Pegel: Lautstärke, Obergrenze, Aufnahmepegel ---

# Lautstärke der Loopstation von 0 (still) bis 1. Der Regler rechts oben im
# Fenster stellt denselben Wert ein. Sie bleibt immer unter der Obergrenze.
# Wirkt sofort.
volume = 0.5

# Obergrenze in dB(FS) von -30 bis 0: Die Ausgabe wird nie lauter als das,
# auch nicht bei vielen Loops und Pieptönen zugleich. Das ist eine Grenze im
# Rechner; den Schalldruck am Ohr bestimmen auch Systemlautstärke und Kopfhörer.
# Wirkt sofort.
max_level_db = -6

# Mikrofonpegel in dB von -24 bis 24 (0 = unverändert). Kurze Spitzen werden
# weich begrenzt, statt hart zu verzerren. Wirkt sofort.
input_gain_db = 0

# true = der Aufnahmepegel wird langsam ausgeglichen (nie lauter, solange das
# Mikrofon übersteuert). Schützt nicht vor einem übersteuerten Mikrofon.
# Wirkt sofort.
auto_gain = false

# true = Pegelanzeige bei der Aufnahme: drei Balken am Pad und die Skala im
# Eltern-Bereich. Das rote "zu laut"-Zeichen erscheint immer. Wirkt sofort.
peak_meter = true

# --- Takt aus der ersten Aufnahme (Onset-Grid) ---

# true = die erste Aufnahme einer Sitzung beginnt bei ihrem ersten Schlag
# (Klatschen, Stampfen). Die Aufnahme wird dabei nur verschoben, nicht gekürzt.
# Liegen zwei oder mehr Schläge im erlaubten Tempo, bestimmt ihr Abstand den
# Takt; sonst gilt die Aufnahmelänge. Weitere Aufnahmen werden nie verschoben.
# false = die Aufnahmelänge ist der Takt wie bisher. Wirkt sofort.
auto_grid = false

# Taktart der Sitzung: "2/4", "3/4", "4/4" oder "6/8". Ein Takt besteht aus so
# vielen Schlägen, wie die Taktart hat (4/4 = 4). Wirkt bei der nächsten ersten Aufnahme.
time_signature = "4/4"

# Erlaubtes Tempo eines Schlags in BPM (20 bis 300) für einen Takt aus
# Schlag-Abständen. Außerhalb davon gibt es kein Raster aus Schlägen. Wirkt sofort.
grid_bpm_min = 40
grid_bpm_max = 200

# --- Geräte und Audio-System ---
# Aufnahme- und Wiedergabegerät (Name wie in der Einstellungsseite). "" = der
# Systemstandard des gewählten Audio-Systems. Wirkt sofort, die Audio-Streams
# starten dafür kurz neu. Ist das Gerät nicht angeschlossen, nimmt die
# Loopstation den Systemstandard und sagt es in der Statuszeile.
input_device = ""
output_device = ""

# Audio-System (PortAudio-Host-API), z. B. "Windows WASAPI", "ALSA".
# "" = Standard der Plattform (Windows: WASAPI geteilt, Linux: ALSA). Wirkt sofort.
audio_hostapi = ""

# Nur Windows: true = ASIO-Treiber für Audio-Interfaces zulassen. ASIO öffnet
# ein Gerät oft exklusiv: Andere Programme sind dann still. Neustart nötig.
asio = false

# --- Takt weich ziehen (Stretch) ---

# true = eine Aufnahme auf dem Takt, die weniger als 10 % neben einem oder
# mehreren ganzen Takten liegt, wird beim Stopp auf genau diese Länge gezogen
# (Tonhöhe bleibt). Alles weiter daneben wird wie bisher mit Stille aufgefüllt
# oder geschnitten. Das Raster bleibt immer hart. Einfacher Stretch, nicht
# Studio-Qualität. Aufnahmen über laufenden Loops liegen schon im Takt und
# werden nur geschnitten oder aufgefüllt, nie gestreckt. false = nie ziehen.
# Wirkt sofort.
stretch_to_grid = true

# --- Metronom (Erweitert) ---

# true = leiser Ton auf jedem Schlag des Takts, durch Lautstärke und Obergrenze.
# Das Kind sieht nur den Puls. Während einer Aufnahme schweigt er, damit er nie
# auf der Aufnahme landet. Wirkt sofort.
metronome_tone = false

# Pegel des Metronom-Tons in dB(FS) von -40 bis -6, vor Lautstärke und
# Obergrenze. Wirkt sofort.
metronome_level_db = -20

# --- Freier Pad-Modus ---

# true = ein Loop auf einem freien Pad (lange halten, das Pad wird rund) beginnt
# erst am nächsten Loop-Anfang der anderen Loops, damit er sich einordnet. Er
# behält dabei seine eigene Länge und wird nie in den Takt geschnitten oder
# gezogen. false = er beginnt sofort. Wirkt sofort.
free_pad_on_grid = false

# --- Marker (Erweitert) ---

# true = ein einzeln gesicherter Loop bekommt seine Marker als Cue-Punkte in die
# WAV-Datei. Klappt das nicht, liegt eine Begleitdatei (.markers.json) daneben;
# das Sichern scheitert daran nie. Wirkt sofort.
export_cue_points = true

# true = ein gesetzter Marker rastet auf die nächste echte Transiente (einen
# Schlag) in der Nähe ein; ohne Schlag in der Nähe bleibt er, wo er ist.
# false (Standard) = er bleibt genau dort, wo er gesetzt wurde. Wirkt sofort.
snap_markers = false

# --- Stretch-Engine (Rubber Band) ---

# Womit eine Aufnahme auf den Takt gezogen wird. "auto" = Rubber Band, wenn es
# installiert ist und läuft, sonst still der einfache eingebaute Stretch.
# "rubberband" = Rubber Band gewünscht: fehlt es oder läuft es nicht, meldet der
# Elternbereich "Rubber Band nicht installiert, einfache Engine aktiv" mit dem
# Weg zum Nachinstallieren, und die App läuft mit dem einfachen Stretch weiter.
# "simple" = immer der einfache Stretch. Rubber Band steht unter der GPL,
# siehe README. Wirkt sofort.
stretch_engine = "auto"

# --- Elternansicht ---

# Minuten, die das Schloss nach der Rechenaufgabe offen bleibt (0 bis 240): so
# lange öffnet erneutes Halten des Schlosses die Elternansicht ohne Aufgabe.
# 0 = immer fragen. Wirkt sofort.
parent_unlock_minutes = 5

# Minuten ohne Eingabe, nach denen die Elternansicht von selbst zur Kinderseite
# zurückkehrt (0 bis 240). 0 = nie. Wirkt sofort.
parent_idle_minutes = 10
